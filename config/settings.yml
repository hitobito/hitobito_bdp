# Settings relevant for the hitobito_bdp wagon
# Overrides settings from the main application
application:
  name: BdP Mitgliederverwaltung
  logo:
    image: bdp-logo.svg
    width: 128
    height: 83
  footer:
    logo_image: bdp-wortmarke.svg
    logo_url: https://www.pfadfinden.de
    links:
      Dokumentation: https://meinbdp.de/spaces/POLARIS/pages/452101963/Mitgliederverwaltung+Polaris+Startseite
      Datenschutzerklärung: https://pfadfinden.de/datenschutzerklaerung
  languages:
    de: Deutsch

  # non UI languages for assigning to person#language
  # additional_languages:
  #   en: Englisch

# URL/Links to external tooling, leave one blank to hide the button.
external_actions:
  group_reporting: "http://localhost:3036/select?groupId=%{group_id}"

  person:
    mitgliedsbescheinigung_url: "http://localhost:3036/personal?personId=%{person_id}"
    austritt_url: ~
    stammeswechsel_url: ~
    zweitmitgliedschaft_url: ~
    mitgliedsart_url: ~

  person_full:
    mitgliedsbescheinigung_url: "http://localhost:3036/select?groupId=%{group_id}&reportId=mitgliedsbescheinigung&p_A_Mitgliedsnummer=%{person_id}"
    austritt_url: ~
    stammeswechsel_url: ~
    zweitmitgliedschaft_url: ~
    mitgliedsart_url: ~

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-bdp@puzzle.ch

email:
  sender: "BdP Mitgliederverwaltung <no-reply@pfadfinden.de>"
  mass_recipient: "BdP <no-reply@pfadfinden.de>"
  list_domain: mail.bdp.de

groups:
  statistics:
    enabled: false
